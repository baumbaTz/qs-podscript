name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QS-PodScript version
      description: Help → "What QS-PodScript uses" (first line)
      placeholder: "0.29.0"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [Windows, Linux, macOS, "Server (qs-podscript server)"]
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics card
      placeholder: "e.g. NVIDIA RTX 3070, AMD RX 7900 XTX, none"
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The relevant part of data/qs-podscript.log (or attach the file)
      render: text
