# Tests on every push and pull request: Linux (with and without FTS5),
# a Windows cross-build and a native macOS build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet -tags sqlite_fts5 .
      - name: Test (with FTS5 search index)
        run: go test -tags sqlite_fts5 ./...
      - name: Test (plain SQLite, search fallback)
        run: go test ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

  windows-cross:
    runs-on: ubuntu-22.04
    timeout-minutes: 20   # a stuck download or apt must fail, not run for hours
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # its own cache: under the Linux job's key (same go.sum) that job saves
          # first, so the Windows objects (SQLite compiled with MinGW, the slow
          # part) were never cached
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml
      - name: MinGW
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - name: Build qs-podscript.exe
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
        run: go build -tags sqlite_fts5 -o qs-podscript.exe .

  macos:
    runs-on: macos-14   # Apple Silicon
    timeout-minutes: 20   # counts running time, not the wait for a free runner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -tags sqlite_fts5 ./...
      - name: Build package
        run: bash build-macos.sh
